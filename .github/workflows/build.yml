name: test-and-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pyinstaller
      - run: pytest -q
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name EX-AutoKey --add-data "templates;templates" --add-data "samples;samples" EX-AutoKey.pyw
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/EX-AutoKey.exe release/
          Copy-Item -Recurse templates release/templates
          Copy-Item -Recurse samples release/samples
          Copy-Item README.md release/
      - uses: actions/upload-artifact@v4
        with:
          name: EX-AutoKey-windows
          path: release
